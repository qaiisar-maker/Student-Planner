:root{
  --bg:#F5F5F8;--bg2:#EAEAF0;--card:#FFFFFF;--ink:#1E2233;--muted:#5A6075;--faint:#9399AB;--line:#E1E2EA;
  --primary:#3B4C8C;--primary-h:#2F3D73;--on-primary:#FFFFFF;--primary-soft:#E2E6F4;--primary-ink:#34437C;
  --accent:#F08A5D;--accent-soft:#FDE7DC;--accent-ink:#9C4520;
  --gold:#E0A43C;--gold-soft:#F8EBD0;--gold-ink:#7D5A17;--rose:#D0503F;--rose-soft:#F8E0DC;--rose-ink:#A03A2C;--slate:#8A95AA;
  --ok:#2B8A57;--ok-soft:#DCF0E4;--ok-ink:#21683F;
  --hero:linear-gradient(135deg,#E2E6F4 0%,#FCE9DF 100%);
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:14px;--fs:16px;--shadow:0 1px 2px rgba(30,34,51,.05),0 6px 20px rgba(30,34,51,.05);
}
[data-theme="sage"]{--bg:#F5F7F3;--bg2:#EAEEE6;--line:#DEE4DA;--ink:#22302A;--muted:#5A6A61;--primary:#4F7A63;--primary-h:#406652;--primary-soft:#E0ECE4;--primary-ink:#3F6350;--accent:#D9A441;--accent-soft:#F7EBCF;--accent-ink:#7E5B14;--hero:linear-gradient(135deg,#E0ECE4 0%,#F8EFDB 100%)}
[data-theme="berry"]{--bg:#FAF5F8;--bg2:#F1E8EE;--line:#E8DCE4;--ink:#2E2029;--muted:#6B5A66;--primary:#8E3B6E;--primary-h:#77305C;--primary-soft:#F2E0EB;--primary-ink:#7A3260;--accent:#3C9A8F;--accent-soft:#DDF0ED;--accent-ink:#22665E;--hero:linear-gradient(135deg,#F2E0EB 0%,#E1F1EE 100%)}
[data-theme="ocean"]{--bg:#F2F7F9;--bg2:#E3EDF1;--line:#D6E3E9;--ink:#18292F;--muted:#536870;--primary:#1F6F8B;--primary-h:#185A71;--primary-soft:#D8EAF1;--primary-ink:#1A5D75;--accent:#F2A541;--accent-soft:#FCEBD2;--accent-ink:#86560F;--hero:linear-gradient(135deg,#D8EAF1 0%,#FCEFDB 100%)}
[data-theme="sunset"]{--bg:#FBF5F1;--bg2:#F3E9E2;--line:#EBDDD3;--ink:#33221B;--muted:#6E5C53;--primary:#C0533A;--primary-h:#A2442F;--primary-soft:#F7E0D8;--primary-ink:#9A412D;--accent:#3E6E9E;--accent-soft:#DFE9F3;--accent-ink:#2B527A;--hero:linear-gradient(135deg,#F7E0D8 0%,#E2EBF4 100%)}
[data-theme="mono"]{--bg:#F6F6F4;--bg2:#EBEBE8;--line:#DEDEDA;--ink:#1F2228;--muted:#5D6068;--primary:#2E3440;--primary-h:#22272F;--primary-soft:#E4E6EA;--primary-ink:#2E3440;--accent:#E9B949;--accent-soft:#FAEFD0;--accent-ink:#7A5C10;--hero:linear-gradient(135deg,#E4E6EA 0%,#FAF0D6 100%)}

  --primary:#8FA6FF;--primary-h:#A6B8FF;--on-primary:#191C2B;--primary-soft:#2C3458;--primary-ink:#C3CFFF;
  --accent:#F2A27A;--accent-soft:#3E2E2A;--accent-ink:#F6C6AE;--gold:#E7C26A;--gold-soft:#41371F;--gold-ink:#EBD199;--rose:#E58A7E;--rose-soft:#4A3130;--rose-ink:#F0C2BE;
  --ok:#6FC195;--ok-soft:#21382D;--ok-ink:#A7E0C0;

[data-size="s"]{--fs:15px}[data-size="l"]{--fs:18px}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.serif,.tile .v,.stat .v{font-feature-settings:"lnum" 1;font-variant-numeric:lining-nums}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;margin:0}
h1{font-size:2.1rem;line-height:1.1}h2{font-size:1.55rem;line-height:1.15}h3{font-size:1.2rem}
p{margin:.3rem 0}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:.82rem}.tiny{font-size:.72rem}
.eyebrow{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--primary);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.brand b{font-family:var(--serif);font-weight:500;font-size:1.15rem;display:block;line-height:1.1;white-space:nowrap}
.brand small{font-size:.62rem;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.tabs{margin-left:auto;display:flex;gap:4px}
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-size:.9rem}
.tab:hover{background:var(--bg2)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.botnav{display:none}
main{max-width:1040px;margin:0 auto;padding:22px 18px 110px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card+.card,.stack>*+*{margin-top:14px}
.hero{background:var(--hero);border:1px solid var(--line);border-radius:18px;padding:20px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile .v{font-family:var(--serif);font-size:1.35rem;line-height:1.2}
.tile .l{font-size:.64rem;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:600}
.tile .s{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-family:var(--serif);font-size:1.7rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cols>*{margin-top:0!important}
.scale button b svg{width:1.4em;height:1.4em}
.stat .l{font-size:.64rem;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-top:2px}
.stat .s{font-size:.75rem;color:var(--muted)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:.88rem;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.pri:hover{background:var(--primary-h)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 11px;font-size:.8rem}
.btn.danger{color:#B3473F}
.btn svg,.ico{width:16px;height:16px;flex:none}
.link{background:none;border:0;padding:0;color:var(--primary-ink);cursor:pointer;font-size:.85rem;font-weight:500}
[data-theme="night"] .link{color:var(--primary)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.74rem;background:var(--primary-soft);color:var(--primary-ink)}
.pill.lav{background:var(--accent-soft);color:var(--accent-ink)}
.pill.gold{background:var(--gold-soft);color:#7A5A1E}[data-theme="night"] .pill.gold{color:var(--gold)}
.pill.rose{background:var(--rose-soft);color:var(--rose-ink)}
/* chips & forms */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.84rem}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.chip.on.s2{background:color-mix(in srgb,var(--accent) 30%,var(--card))}
.chip.on.s3{background:var(--accent);color:#fff}
.scale{display:flex;gap:6px}
.scale button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;cursor:pointer;font-size:.8rem;color:var(--muted)}
.scale button b{display:block;font-size:1.25rem;color:var(--ink);font-weight:400}
.scale button.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-ink)}
label.f{display:block;font-size:.8rem;color:var(--muted);margin-bottom:5px;font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.sec{margin-top:18px}.sec>h4{margin:0 0 8px;font-size:.9rem;font-weight:600}
/* lists */
.list>div{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}
.grow{flex:1;min-width:0}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mi{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left}
.mi:hover{border-color:var(--faint)}
.mi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--primary-soft);color:var(--primary-ink)}
.mi .ic.lav{background:var(--accent-soft);color:var(--accent-ink)}
.mi .ic.gold{background:var(--gold-soft);color:var(--gold)}
.mi .ic.rose{background:var(--rose-soft);color:var(--rose-ink)}
.mi b{font-weight:500;font-size:.92rem;display:block}.mi span{font-size:.76rem;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:4px;margin-bottom:10px}
/* insights */
.ins{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px 12px 12px 4px;padding:12px 14px;background:var(--card)}
.ins.sage{border-left-color:var(--primary)}.ins.gold{border-left-color:var(--gold)}.ins.rose{border-left-color:var(--rose)}.ins.slate{border-left-color:var(--slate)}
.ins .eyebrow{margin-bottom:4px}
.ins p{font-size:.88rem;margin:0}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dh{text-align:center;font-size:.66rem;letter-spacing:.1em;color:var(--faint);font-weight:600;padding:4px 0}
.cd{aspect-ratio:1/0.82;border-radius:10px;background:var(--bg);border:1px solid var(--line);padding:5px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:0}
.cd:hover{border-color:var(--faint)}
.cd .n{font-size:.82rem}
.cd.out{opacity:.35}
.cd.bleed{background:var(--rose-soft);border-color:color-mix(in srgb,var(--rose) 40%,var(--line))}
.cd.spot{background:color-mix(in srgb,var(--rose-soft) 50%,var(--bg))}
.cd.today{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.cd.sel{outline:2px solid var(--accent);outline-offset:1px}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:6px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.74rem;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-size:10px;fill:var(--faint);font-family:var(--sans)}
.bar-row{display:grid;grid-template-columns:130px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:.84rem;padding:4px 0}
.bar-bg{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar-fg{height:100%;background:var(--accent);border-radius:99px}
/* accordion */
details.acc{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:8px}
details.acc summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:500;font-size:.92rem}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary:after{content:"";margin-left:auto;width:8px;height:8px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:rotate(45deg);transition:.2s}
details.acc[open] summary:after{transform:rotate(-135deg)}
details.acc .b{padding:0 14px 14px 14px;font-size:.88rem;color:var(--muted)}
.note{background:var(--bg2);border-radius:12px;padding:12px 14px;font-size:.82rem;color:var(--muted)}
.private{background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);border-radius:14px;padding:14px 16px;color:var(--primary-ink)}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(30,32,28,.38);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.sheet{background:var(--card);border-radius:20px;width:100%;max-width:620px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:up .2s}
.sheet .hd{padding:18px 20px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sheet .bd{padding:6px 20px 20px;overflow:auto}
.sheet .ft{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.x{margin-left:auto;border:0;background:var(--bg2);width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(16px);opacity:0}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.86rem;z-index:60;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast button{background:none;border:0;color:var(--bg);font-weight:600;cursor:pointer;text-decoration:underline}
.foot{text-align:center;font-size:.72rem;color:var(--faint);margin-top:30px}
.swatch{display:flex;gap:4px}.swatch i{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.08)}
.opt{border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--card);display:flex;align-items:center;gap:10px;font-size:.86rem}
.opt.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
#print{display:none}
@media (max-width:760px){
  h1{font-size:1.75rem}
  .tabs{display:none}
  .botnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .botnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;color:var(--faint);padding:4px 0;cursor:pointer}
  .botnav button svg{width:22px;height:22px}
  .botnav button.on{color:var(--primary)}
  main{padding:16px 14px 100px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .menu{grid-template-columns:minmax(0,1fr)}
  .cal{gap:3px}.cd{border-radius:8px;padding:3px 2px}.dot{width:5px;height:5px}
  .bar-row{grid-template-columns:100px minmax(0,1fr) 82px;font-size:.78rem}.bar-row>span:last-child{white-space:nowrap}
  .ov{align-items:flex-end;padding:0}
  .sheet{border-radius:20px 20px 0 0;max-height:94vh}
}
@media print{
  body{background:#fff;color:#000}
  .top,.botnav,main,.ov,.toast{display:none!important}
  #print{display:block;padding:0;font-size:11pt}
  #print h1{font-size:22pt}#print h2{font-size:15pt;margin-top:16px}
  #print table{width:100%;border-collapse:collapse;margin-top:6px}
  #print td,#print th{border-bottom:1px solid #ddd;padding:5px 4px;text-align:left;font-size:10pt}
}

.tile .v,.stat .v{font-family:'QDigits',var(--serif);}

/* wedding extras */
.ring{width:132px;height:132px;flex:none}
.ring text{font-family:var(--serif);fill:var(--ink)}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count .big{font-family:'QDigits',var(--serif);font-size:3rem;line-height:1;color:var(--primary-ink);font-weight:500}
[data-theme="night"] .count .big{color:var(--primary)}
.count span:last-child{color:var(--muted);font-size:.95rem}
.prog{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--primary);border-radius:99px}
.chk{width:20px;height:20px;accent-color:var(--primary);flex:none;cursor:pointer}
.done-t{text-decoration:line-through;color:var(--faint)!important}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.photo{border-radius:12px;overflow:hidden;background:var(--bg2);position:relative}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.stepdot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none}
.stepdot.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}.stepdot svg{width:13px;height:13px}
button.tile{font:inherit;text-align:left;cursor:pointer;color:inherit}button.tile:hover{border-color:var(--faint)}
.seg{display:inline-flex;background:var(--bg2);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;cursor:pointer;font-size:.86rem;color:var(--muted);white-space:nowrap}

.rsvpbar,.mbar{height:12px;background:var(--bg2);border-radius:99px;overflow:hidden;display:flex;margin-top:12px}
.rsvpbar i,.mbar i{display:block;height:100%}
.rsvpbar .y,.mbar .paid{background:var(--primary)}.rsvpbar .n{background:var(--rose)}.mbar .owed{background:var(--gold)}
.clk{cursor:pointer}.list>.clk:hover,.list .clk:hover{background:color-mix(in srgb,var(--bg2) 50%,transparent)}
.list>div.clk{margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:8px}
.phn{width:28px;height:28px;border-radius:50%;background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;font-family:var(--serif);font-size:1rem;flex:none}
details.ph.now{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
details.ph .b{color:var(--ink)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.vgrid>.card{margin-top:0!important}
.vcard:hover{border-color:var(--faint)}
.vcard .link svg,.tiny svg{width:13px;height:13px;vertical-align:-2px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.tgrid>.card{margin-top:0!important}
.tsvg{width:150px;height:auto;display:block;margin:8px auto 4px}
.tsvg .tb{fill:var(--primary-soft);stroke:var(--primary);stroke-width:1}
.tsvg circle:not(.tb){fill:var(--card);stroke:var(--faint);stroke-width:1}.tsvg circle.on{fill:var(--primary);stroke:var(--primary)}
.tsvg text{font-family:var(--serif);font-size:15px;fill:var(--primary-ink)}
[data-theme="night"] .tsvg text{fill:var(--ink)}
.timeline{position:relative}
.tl-row{display:flex;gap:14px;padding:10px 6px;border-top:1px solid var(--line);border-radius:8px}.tl-row:first-child{border-top:0}
.tl-t{width:76px;flex:none;font-family:'QDigits',var(--serif);font-size:1.05rem;color:var(--primary-ink)}
[data-theme="night"] .tl-t{color:var(--primary)}
.tl-d{flex:1;min-width:0;border-left:2px solid var(--primary-soft);padding-left:12px}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.idea{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.idea .photo{aspect-ratio:4/5;border-radius:0}
.idea .ib{padding:10px 12px}.idea .ib b{display:block;font-weight:500;margin-top:2px}
.photo-pick{border:1.5px dashed var(--line);border-radius:14px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);cursor:pointer;margin-top:14px;overflow:hidden;font-size:.85rem}
.photo-pick img{width:100%;max-height:260px;object-fit:cover;display:block}
button.pill{border:0;cursor:pointer;font:inherit;font-size:.74rem}
.pill.lav{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.empty{text-align:center;padding:24px 10px;color:var(--muted)}
.stack>.card+.card{margin-top:14px}
@media (max-width:760px){ .count .big{font-size:2.4rem} .ring{width:104px;height:104px} .seg button{padding:7px 12px} .tl-t{width:64px} }
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl td,.tbl th{padding:8px 6px;border-top:1px solid var(--line);text-align:left}
.tbl th{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border-top:0}

.stat .v,.tile .v{font-family:'QDigits',var(--serif)}
.g3.keep{grid-template-columns:repeat(3,minmax(0,1fr))!important}

:root{color-scheme:light}

.chk{appearance:none;-webkit-appearance:none;border:1.5px solid var(--faint);border-radius:5px;background:var(--card);display:inline-grid;place-items:center;margin:0}

.thumb{width:46px;height:46px;border-radius:10px;background:var(--bg2);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--faint)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb svg{width:20px;height:20px}
.thumb.lg{width:100%;height:auto;aspect-ratio:4/3;border-radius:14px}

.verdict.think{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 40%,transparent);color:var(--gold-ink)}
.verdict.pass{background:var(--rose-soft);border-color:color-mix(in srgb,var(--rose) 40%,transparent);color:var(--rose-ink)}
.verdict .vv{font-family:var(--serif);font-size:2.1rem;line-height:1.1}
.verdict .vn{font-family:'QDigits',var(--sans);font-size:1.5rem;font-weight:500;margin-top:4px}

.pchips{display:flex;flex-wrap:wrap;gap:6px}

/* teacher extras */
.att{display:inline-flex;gap:4px}
.att button{width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:.8rem;color:var(--muted)}
.att button.on.P{background:var(--ok-soft);border-color:var(--ok);color:var(--ok-ink)}
.att button.on.A{background:var(--rose-soft);border-color:var(--rose);color:var(--rose-ink)}
.att button.on.L{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink)}
.att button.on.E{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-ink)}
.gb{border-collapse:separate;border-spacing:0;font-size:.82rem;min-width:100%}
.gb th,.gb td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:center;white-space:nowrap}
.gb th:first-child,.gb td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;min-width:130px}
.gb th{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;vertical-align:bottom}
.gb input{width:54px;padding:5px 4px;text-align:center;border-radius:7px}

const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pkey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const todayKey = () => dkey(new Date());
const addDays = (k, n) => { const d = pkey(k); d.setDate(d.getDate()+n); return dkey(d); };
const diffDays = (a, b) => Math.round((pkey(b) - pkey(a)) / 864e5);
const rangeKeys = (n, end=todayKey()) => { const a=[]; for (let i=n-1;i>=0;i--) a.push(addDays(end,-i)); return a; };

const MONF = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const fmtLong = k => { const d = pkey(k); return `${WDF[d.getDay()]}, ${MONF[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };
const fmtMid = k => { const d = pkey(k); return `${WD[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtTime = ts => { const d = new Date(ts); let h = d.getHours(), m = d.getMinutes(); const ap = h>=12?'PM':'AM'; h = h%12||12; return `${h}:${pad(m)} ${ap}`; };
const hourLabel = h => `${h%12||12} ${h>=12?'PM':'AM'}`;
const fmtHM = hrs => { if (hrs==null || isNaN(hrs)) return '—'; const h = Math.floor(hrs), m = Math.round((hrs-h)*60); return m===60 ? `${h+1}h` : `${h}h${m?` ${pad(m)}m`:''}`; };
const fmtMin = m => { m=Math.round(m); if (!(m>0)) return '0 min'; const h=Math.floor(m/60), r=m%60; return h ? `${h}h${r?' '+r+'m':''}` : `${r} min`; };

let toastT;
function toast(msg, undo){
  $$('.toast').forEach(t=>t.remove()); clearTimeout(toastT);
  const t = document.createElement('div'); t.className='toast'; t.innerHTML = `<span>${esc(msg)}</span>${undo?'<button>Undo</button>':''}`;
  document.body.appendChild(t);
  if (undo) t.querySelector('button').onclick = () => { undo(); t.remove(); };
  toastT = setTimeout(()=>t.remove(), 4200);
}
function modal(title, body, foot, opts={}){
  closeModal();

  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="hd"><h2 style="font-size:1.4rem">${title}</h2><button class="x" aria-label="Close">${ic('x')}</button></div><div class="bd">${body}</div>${foot?`<div class="ft">${foot}</div>`:''}</div>`;
  document.body.appendChild(ov);

  $('.x', ov).onclick = closeModal;
  document.body.style.overflow='hidden';
  return ov;
}

function barChart(vals, labels, o={}){
  const W=o.w||(innerWidth<760?380:640), H=o.h||150, pl=24, pb=20, pt=8, n=vals.length, max=Math.max(o.max||0, ...vals, 1);
  const bw=(W-pl)/n, gap=Math.min(6, bw*.3);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for (let g=0; g<=2; g++){ const y=pt+(H-pt-pb)*(1-g/2); s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="${g?'3 4':''}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${r1(max*g/2).replace(/\.0$/,'')}</text>`; }
  vals.forEach((v,i)=>{ const h=(H-pt-pb)*(v/max), x=pl+i*bw+gap/2, y=H-pb-h;
    if (v>0) s+=`<rect x="${x}" y="${y}" width="${Math.max(bw-gap,1.5)}" height="${h}" rx="${Math.min(3,(bw-gap)/2)}" fill="${o.color||'var(--gold)'}"><title>${esc(labels[i]||'')}: ${r1(v)}</title></rect>`;
    const every = o.every || Math.ceil(n/8);
    if (labels[i] && i%every===0) s+=`<text x="${x+(bw-gap)/2}" y="${H-5}" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  return s+'</svg>';
}
function lineChart(series, labels, o={}){
  const W=o.w||(innerWidth<760?380:640), H=o.h||160, pl=24, pb=20, pt=10, n=labels.length, min=o.min??0, max=o.max??Math.max(...series.flatMap(s=>s.vals.filter(v=>v!=null)),1);
  const X=i=>pl+(n<=1?0:(W-pl-8)*i/(n-1)), Y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min||1));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  const ticks = o.ticks || [min,(min+max)/2,max];
  ticks.forEach(t=>{ s+=`<line x1="${pl}" x2="${W}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl-6}" y="${Y(t)+3}" text-anchor="end">${o.fmt?o.fmt(t):r1(t).replace(/\.0$/,'')}</text>`; });
  const every = o.every || Math.ceil(n/7);
  labels.forEach((l,i)=>{ if(i%every===0) s+=`<text x="${X(i)}" y="${H-5}" text-anchor="middle">${esc(l)}</text>`; });
  series.forEach(se=>{
    let d='', area='', started=false, lastX=0, firstX=0;
    se.vals.forEach((v,i)=>{ if(v==null) return; d+=(started?'L':'M')+X(i)+' '+Y(v)+' '; if(!started) firstX=X(i); started=true; lastX=X(i); });
    if (!started) return;
    if (se.fill) s+=`<path d="${d}L${lastX} ${H-pb} L${firstX} ${H-pb} Z" fill="${se.color}" opacity=".12"/>`;
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    se.vals.forEach((v,i)=>{ if(v!=null) s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="var(--card)" stroke="${se.color}" stroke-width="1.6"><title>${esc(labels[i])}: ${o.fmt?o.fmt(v):r1(v)}</title></circle>`; });
  });
  return s+'</svg>';
}

/* ---------- photo storage (IndexedDB, stays on device) ---------- */
const PH = {cache:{}, db:null};
function phDB(){ return PH.db || (PH.db = new Promise((res,rej)=>{ try { const r=indexedDB.open(APP.photoDB,1); r.onupgradeneeded=()=>r.result.createObjectStore('p'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); } catch(e){ rej(e); } })); }
async function phPut(id, data){ const db=await phDB(); return new Promise((res,rej)=>{ const t=db.transaction('p','readwrite'); t.objectStore('p').put(data,id); t.oncomplete=()=>{PH.cache[id]=data;res();}; t.onerror=()=>rej(t.error); }); }
async function phGet(id){ if (PH.cache[id]) return PH.cache[id]; const db=await phDB(); return new Promise(res=>{ const r=db.transaction('p').objectStore('p').get(id); r.onsuccess=()=>{ PH.cache[id]=r.result; res(r.result); }; r.onerror=()=>res(null); }); }
async function phDel(id){ delete PH.cache[id]; const db=await phDB(); return new Promise(res=>{ const t=db.transaction('p','readwrite'); t.objectStore('p').delete(id); t.oncomplete=res; t.onerror=res; }); }
async function phAll(){ const db=await phDB(); return new Promise(res=>{ const out={}; const r=db.transaction('p').objectStore('p').openCursor(); r.onsuccess=()=>{ const c=r.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); }; r.onerror=()=>res(out); }); }
function shrink(file, max=1400){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82)); }; im.onerror=rej; im.src=fr.result; }; fr.onerror=rej; fr.readAsDataURL(file); }); }
function pickPhoto(){ return new Promise(res=>{ const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.onchange=async()=>{ if(!i.files[0]) return res(null); try{ res(await shrink(i.files[0])); }catch(e){ toast("That image couldn't be opened."); res(null);} }; i.click(); }); }

/* ---------- time helpers ---------- */
const toMin = t => { if(!t || !/^\d{1,2}:\d{2}$/.test(t)) return null; const [h,m]=t.split(':').map(Number); return h*60+m; };
const hm = t => { const m=toMin(t); if(m==null) return ''; let h=Math.floor(m/60)%24; const mi=m%60, ap=h>=12?'PM':'AM'; h=h%12||12; return `${h}:${pad(mi)} ${ap}`; };
const nowMin = () => { const d=new Date(); return d.getHours()*60+d.getMinutes(); };
const dow = k => pkey(k).getDay();
const weekStart = (off=0) => { const t=todayKey(), d=dow(t); return addDays(t, -((d+6)%7) + off*7); };

/* ---------- lookups ---------- */
const sub = id => DB.subjects.find(s=>s.id===id) || null;
const subName = id => (sub(id)||{}).name || 'General';
const subColor = id => (sub(id)||{}).color || 'var(--faint)';
const task = id => DB.tasks.find(t=>t.id===id) || null;
const exam = id => DB.exams.find(e=>e.id===id) || null;
const slotsOn = k => DB.slots.filter(s=>s.day===dow(k)).sort((a,b)=>toMin(a.start)-toMin(b.start));
const subsOn = k => [...new Set(slotsOn(k).map(s=>s.sub))].filter(sub);
/* due label: today / tomorrow / in N days / N days late */
function dueLabel(t){ if (!t.due) return 'No date'; const n=diffDays(todayKey(), t.due);
  return n===0?'Due today':n===1?'Due tomorrow':n>1?(n<7?`Due ${WD[dow(t.due)]}`:`Due ${fmtShort(t.due)}`)+` · ${plural(n,'day')}`:`${plural(-n,'day')} late`; }
const isLate = t => !t.done && t.due && t.due<todayKey();
const openTasks = () => DB.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999') || ({high:0,med:1,low:2}[a.pri]-{high:0,med:1,low:2}[b.pri]));
const daysTo = k => diffDays(todayKey(), k);
const upcomingExams = () => DB.exams.filter(e=>e.date>=todayKey()).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));

/* ---------- grades ---------- */
const gPct = g => num(g.max)>0 && g.score!=='' && g.score!=null && isFinite(+g.score) ? +g.score/num(g.max)*100 : null;
const gradesFor = sid => DB.grades.filter(g=>g.sub===sid).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
/* category average = total points / total possible in that category */
function catAvg(sid, cat){ const G=gradesFor(sid).filter(g=>g.cat===cat && gPct(g)!=null); const mx=G.reduce((s,g)=>s+num(g.max),0); return mx>0 ? G.reduce((s,g)=>s+ +g.score,0)/mx*100 : null; }
/* subject average: with category weights -> weighted by the weights of categories that have marks; without weights -> total points / total possible */
function subAvg(sid){ const s=sub(sid); if(!s) return null; const W=s.weights||{}, cats=Object.keys(W).filter(c=>num(W[c])>0);
  if (cats.length){ let ws=0, acc=0; cats.forEach(c=>{ const a=catAvg(sid,c); if (a!=null){ acc+=a*num(W[c]); ws+=num(W[c]); } });
    const other=gradesFor(sid).filter(g=>gPct(g)!=null && !cats.includes(g.cat)); if (!ws && !other.length) return null; if (!ws) return plainAvg(other); return acc/ws; }
  return plainAvg(gradesFor(sid).filter(g=>gPct(g)!=null)); }
function plainAvg(G){ const mx=G.reduce((s,g)=>s+num(g.max),0); return mx>0 ? G.reduce((s,g)=>s+ +g.score,0)/mx*100 : null; }
const SCALES = {
  us:[[93,'A',4.0],[90,'A-',3.7],[87,'B+',3.3],[83,'B',3.0],[80,'B-',2.7],[77,'C+',2.3],[73,'C',2.0],[70,'C-',1.7],[67,'D+',1.3],[65,'D',1.0],[0,'F',0]],
  af:[[90,'A',4],[80,'B',3],[70,'C',2],[60,'D',1],[0,'F',0]],
  pk:[[85,'A',4.0],[80,'A-',3.7],[75,'B+',3.3],[71,'B',3.0],[68,'B-',2.7],[64,'C+',2.3],[61,'C',2.0],[58,'C-',1.7],[54,'D+',1.3],[50,'D',1.0],[0,'F',0]]};
const scale = () => SCALES[DB.settings.scale] || SCALES.us;
const gradeOf = p => p==null ? null : scale().find(([m])=>p>=m-1e-9) || scale()[scale().length-1];
const letter = p => (gradeOf(p)||[])[1] || '—';
/* GPA = sum(points x credits) / sum(credits), only subjects that have an average */
function termGpa(){ let cr=0, pts=0; DB.subjects.forEach(s=>{ const a=subAvg(s.id), c=num(s.credits)||0; if (a!=null && c>0){ cr+=c; pts+=gradeOf(a)[2]*c; } }); return {credits:cr, gpa:cr?pts/cr:null}; }
function cumGpa(){ const t=termGpa(), pg=num(DB.settings.prevGpa), pc=num(DB.settings.prevCred); if (!(pc>0) || DB.settings.prevGpa==='') return t.gpa; if (t.gpa==null) return pg; return (pg*pc + t.gpa*t.credits)/(pc+t.credits); }
/* score needed on the final: target = current x (1-w) + final x w */
function finalNeeded(cur, target, w){ if (cur==null || !(w>0 && w<=100)) return null; const f=w/100; return (target - cur*(1-f))/f; }

/* ---------- attendance ---------- */
const attGet = (k, sid) => ((DB.att[k]||{})[sid]) || '';
function attSet(k, sid, v){ DB.att[k]=DB.att[k]||{}; if (v) DB.att[k][sid]=v; else delete DB.att[k][sid]; if (!Object.keys(DB.att[k]).length) delete DB.att[k]; }
/* attendance % = (present + late) / (present + late + absent); excused left out */
function attStats(sid){ let p=0,l=0,a=0,e=0; Object.values(DB.att).forEach(d=>{ const v=d[sid]; if(v==='P')p++; else if(v==='L')l++; else if(v==='A')a++; else if(v==='E')e++; });
  const n=p+l+a, att=p+l, min=num(DB.settings.minAtt)/100; const pct=n?att/n*100:null;
  /* how many more classes can be missed and still stay at the minimum; or how many in a row needed to get back */
  let canMiss=null, need=null; if (n && min>0 && min<1){ if (att/n>=min-1e-9) canMiss=Math.floor(att/min - n + 1e-9); else need=Math.ceil((min*n - att)/(1-min) - 1e-9); }
  return {p,l,a,e,n,pct,canMiss,need}; }

/* ---------- study time ---------- */
const studySec = (k, sid) => num((DB.study[k]||{})[sid]);
const studyDay = k => Object.values(DB.study[k]||{}).reduce((s,v)=>s+num(v),0);
function studyAdd(sid, sec){ const k=todayKey(); DB.study[k]=DB.study[k]||{}; const key=sid||'_'; DB.study[k][key]=num(DB.study[k][key])+sec; }
const studyWeek = sid => rangeKeys(7).reduce((s,k)=>s+studySec(k,sid||'_'),0);

/* ---------- exams: revision plan ---------- */
/* spread the topics not yet revised over the days from today to the day before the exam */
function revisionPlan(e){ const left=e.topics.filter(t=>!t.done), days=Math.max(0, daysTo(e.date)); if (!left.length) return {err:'All topics are revised already'}; if (days<1) return {err:'The exam is today — no days left to plan'};
  const per=Math.ceil(left.length/days), out=[]; left.forEach((t,i)=>{ const d=Math.floor(i/per); out.push({day:addDays(todayKey(),d), topic:t}); }); return {per, days, out}; }

/* ---------- habits ---------- */
const habit = id => DB.habits.find(h=>h.id===id) || null;
const hDone = (k, id) => (DB.hlog[k]||[]).includes(id);
const hDue = (h, k) => (h.days||[]).includes(dow(k));
function hToggle(k, id){ const a=DB.hlog[k]||[]; DB.hlog[k] = a.includes(id) ? a.filter(x=>x!==id) : [...a, id]; if(!DB.hlog[k].length) delete DB.hlog[k]; }
function streak(h){ let k=todayKey(), n=0; if (hDue(h,k) && !hDone(k,h.id)) k=addDays(k,-1);
  for (let i=0;i<730;i++){ if (hDue(h,k)){ if (hDone(k,h.id)) n++; else break; } else if (hDone(k,h.id)) n++; k=addDays(k,-1); } return n; }
const fmtGpa = g => g==null ? '—' : (Math.round(g*100)/100).toFixed(2);
const fmtPct = p => p==null ? '—' : (Math.round(p*10)/10).toString().replace(/\.0$/,'')+'%';

/* ---------- router ---------- */
const S = {view:'today', sub:null, sseg:'week', wday:null, cm:0, cday:null, tseg:'up', tsub:'', gseg:'grades', gsid:null};
const TABS = [['today','Today','today'],['schedule','Schedule','calendar'],['tasks','Tasks','check'],['grades','Grades','bars'],['more','More','more']];
function go(view, sub=null){ S.view=view; S.sub=sub; render(); window.scrollTo(0,0); }
function render(){
  document.documentElement.dataset.theme = DB.settings.theme;
  document.documentElement.dataset.size = DB.settings.size;

  $('#app').innerHTML = V() + `<div class="foot">${APP.name} · v${APP.version} · ${APP.studio}<br>Private and offline — everything stays on this device.</div>`;

}

  const a = e.target.closest('[data-act]'); if (a){ if (a.type!=='checkbox') e.preventDefault(); ACT[a.dataset.act]?.(a.dataset.arg, a, e); }
});
const ACT = {};
const SUBV = {};

/* ---------- study timer (visual) ---------- */
const TM = {mode:'focus', total:null, left:null, end:0, run:false, sid:'', tid:'', l0:0};
const fLen = () => (num(DB.settings.focus)||25)*60, bLen = () => (num(DB.settings.brk)||5)*60;
function tmInit(){ if (TM.total==null){ TM.total=fLen(); TM.left=TM.total; } }
function tmLeft(){ tmInit(); return TM.run ? Math.max(0, Math.round((TM.end-Date.now())/1000)) : TM.left; }
const tmText = () => { const s=tmLeft(); return `${Math.floor(s/60)}:${pad(s%60)}`; };
/* credit study seconds since the last start to today's subject total and to the chosen task */
function tmCredit(){ if (TM.mode!=='focus') return; const sec=Math.max(0, TM.l0 - tmLeft()); TM.l0=tmLeft(); if (!sec) return;
  studyAdd(TM.sid, sec); const t=task(TM.tid); if (t) t.studySec=num(t.studySec)+sec; save(); }
function pie(frac){ const f=Math.max(0,Math.min(1,frac)), r=46, a=f*2*Math.PI, x=50+r*Math.sin(a), y=50-r*Math.cos(a);
  const sector = f>=.9999 ? `<circle cx="50" cy="50" r="${r}" class="pf"/>` : f<=0 ? '' : `<path class="pf" d="M50 50 L50 ${50-r} A${r} ${r} 0 ${a>Math.PI?1:0} 1 ${x.toFixed(2)} ${y.toFixed(2)} Z"/>`;
  let ticks=''; for (let i=0;i<60;i+=5){ const t=i/60*2*Math.PI; ticks+=`<line x1="${50+47*Math.sin(t)}" y1="${50-47*Math.cos(t)}" x2="${50+(i%15?44:42)*Math.sin(t)}" y2="${50-(i%15?44:42)*Math.cos(t)}"/>`; }
  return `<svg class="vt" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" class="pb"/>${sector}<g class="tk">${ticks}</g><circle cx="50" cy="50" r="3" class="pc"/></svg>`; }
function tick(){ tmInit(); const l=tmLeft();
  $$('.tmr').forEach(e=>e.textContent=tmText());
  $$('.tmbtn').forEach(b=>b.innerHTML=TM.run?`${ic('pause')} Pause`:`${ic('play')} ${TM.left<TM.total?'Resume':'Start'}`);
  $$('.vtw').forEach(w=>w.innerHTML=pie(TM.total?l/TM.total:0));
  $$('.tmmode').forEach(e=>e.textContent=TM.mode==='focus'?'Study':'Break'); }
function beep(){ if (!DB.settings.sound) return; try { const C=new (window.AudioContext||window.webkitAudioContext)(); [0,.35,.7].forEach(d=>{ const o=C.createOscillator(), g=C.createGain(); o.frequency.value=660; o.connect(g); g.connect(C.destination); g.gain.setValueAtTime(.0001,C.currentTime+d); g.gain.exponentialRampToValueAtTime(.25,C.currentTime+d+.02); g.gain.exponentialRampToValueAtTime(.0001,C.currentTime+d+.3); o.start(C.currentTime+d); o.stop(C.currentTime+d+.32); }); } catch(e){} }
setInterval(()=>{
  if (TM.run && tmLeft()<=0){ tmCredit(); TM.run=false; try{ navigator.vibrate&&navigator.vibrate([200,100,200]); }catch(e){} beep();
    if (TM.mode==='focus'){ const k=todayKey(); DB.days[k]=DB.days[k]||{}; DB.days[k].sessions=num(DB.days[k].sessions)+1; save(); TM.mode='break'; TM.total=TM.left=bLen(); toast('Study session done ✓ — take a short break'); }
    else { TM.mode='focus'; TM.total=TM.left=fLen(); toast('Break over — ready when you are'); }
    if (S.view==='today' || S.sub==='study') render(); }
  tick(); }, 1000);
ACT.tmToggle = () => { tmInit(); if (TM.run){ tmCredit(); TM.left=tmLeft(); TM.run=false; } else { if (TM.left<=0) TM.left=TM.total; TM.l0=TM.left; TM.end=Date.now()+TM.left*1000; TM.run=true; } tick(); };
ACT.tmReset = () => { if (TM.run) tmCredit(); TM.run=false; TM.left=TM.total; tick(); };
ACT.tmLen = m => { if (TM.run) tmCredit(); TM.run=false; TM.mode='focus'; TM.total=TM.left=Math.round(num(m))*60; render(); };
ACT.tmAdd = () => { tmInit(); if (TM.run){ TM.end+=300000; TM.l0+=300; } else TM.left+=300; TM.total=Math.max(TM.total, tmLeft()); tick(); };
ACT.tmBreak = () => { if (TM.run) tmCredit(); TM.run=false; TM.mode='break'; TM.total=TM.left=bLen(); render(); };
ACT.studyOn = id => { const t=task(id); if (TM.run) tmCredit(); TM.tid=id||''; if (t) TM.sid=t.sub||''; go('more','study'); };

/* ---------- today ---------- */
function taskRow(t, opts={}){
  const st=t.steps.length?`<span class="mchip">${ic('steps')} ${t.steps.filter(s=>s.done).length}/${t.steps.length}</span>`:'';
  return `<div class="trow ${t.done?'is-done':''}" style="--kc:${subColor(t.sub)}"><input type="checkbox" class="chk" data-act="taskTog" data-arg="${t.id}" ${t.done?'checked':''} aria-label="Done">
   <div class="grow clk" data-act="taskEdit" data-arg="${t.id}"><div class="bn">${t.pri==='high'?`<span class="star">${ic('star')}</span>`:''}${esc(t.title)}</div>
    <div class="bm"><span class="pl"><i style="background:${subColor(t.sub)}"></i>${esc(subName(t.sub))}</span><span>${kindName(t.kind)}</span><span class="${isLate(t)?'neg':t.due===todayKey()&&!t.done?'warn':''}">${dueLabel(t)}</span>${st}</div></div>
   ${t.done||opts.noPlay?'':`<button class="ibtn" data-act="studyOn" data-arg="${t.id}" title="Study timer" aria-label="Start study timer">${ic('play')}</button>`}</div>`;
}

function taskEditor(x){ const isNew=!DB.tasks.includes(x), W={steps:JSON.parse(JSON.stringify(x.steps)), pdata:null, photo:x.photo||''};
  const ov = modal(isNew?'Add a task':'Edit task', `<div class="sec"><label class="f">What *</label><input type="text" id="tk-t" value="${esc(x.title)}" placeholder="Lab report: enzymes"></div>
   <div class="grid g3 sec"><div><label class="f">Subject</label><select id="tk-s">${subOpts(x.sub)}</select></div><div><label class="f">Type</label><select id="tk-k">${TASK_KINDS.map(([k,l])=>`<option value="${k}" ${k===x.kind?'selected':''}>${l}</option>`).join('')}</select></div><div><label class="f">Due</label><input type="date" id="tk-d" value="${x.due||''}"></div></div>
   <div class="grid g2 sec"><div><label class="f">Priority</label><div class="seg" id="tk-p">${PRI.map(([k,l])=>`<button class="${x.pri===k?'on':''}" data-p="${k}">${l}</button>`).join('')}</div></div><div><label class="f">Time it needs (min)</label><input type="number" id="tk-e" min="0" max="1440" value="${x.est||''}" placeholder="45"></div></div>
   <div class="sec"><label class="f">Steps <span class="faint">(break a big project down)</span></label><div id="tk-st" class="steps-ed"></div><div class="row" style="margin-top:8px;flex-wrap:nowrap"><input type="text" id="tk-ns" placeholder="e.g. Find 3 sources"><button class="btn sm" id="tk-add">${ic('plus')}</button></div></div>
   <div class="sec"><label class="f">Notes</label><textarea id="tk-n" style="min-height:70px" placeholder="Page numbers, instructions, links…">${esc(x.notes||'')}</textarea></div>
   <div class="sec"><label class="f">Photo <span class="faint">(e.g. the worksheet or board)</span></label><div class="photo-pick" id="tk-ph" style="margin-top:0;min-height:90px">${ic('camera')}<span>Add a photo</span></div>${W.photo?'<button class="link tiny" id="tk-phx" style="margin-top:6px">Remove photo</button>':''}</div>
   ${num(x.studySec)>=60?`<p class="tiny faint sec">Studied for this task: ${fmtMin(num(x.studySec)/60)}</p>`:''}`,
   `${isNew?'':'<button class="btn danger ghost" data-del style="margin-right:auto">Delete</button>'}<button class="btn" data-c>Cancel</button><button class="btn pri" data-s>Save</button>`);
  let pri=x.pri; $$('#tk-p button',ov).forEach(b=>b.onclick=()=>{ pri=b.dataset.p; $$('#tk-p button',ov).forEach(y=>y.classList.toggle('on',y===b)); });
  const draw = () => { $('#tk-st',ov).innerHTML = W.steps.map((s,i)=>`<div class="sr"><input type="checkbox" class="chk" data-i="${i}" ${s.done?'checked':''} aria-label="Step done"><input type="text" class="st-t" data-i="${i}" value="${esc(s.text)}"><button class="ibtn" data-x="${i}" aria-label="Remove step">${ic('x')}</button></div>`).join('') || '<p class="tiny faint">No steps yet.</p>';
    $$('#tk-st .chk',ov).forEach(c=>c.onchange=()=>{ W.steps[+c.dataset.i].done=c.checked; }); $$('#tk-st .st-t',ov).forEach(c=>c.oninput=()=>{ W.steps[+c.dataset.i].text=c.value; });
    $$('#tk-st [data-x]',ov).forEach(c=>c.onclick=()=>{ W.steps.splice(+c.dataset.x,1); draw(); }); };
  draw();
  const add = () => { const i=$('#tk-ns',ov), v=i.value.trim(); if(!v) return; W.steps.push({id:uid(), text:v, done:false}); i.value=''; draw(); i.focus(); };
  $('#tk-add',ov).onclick = add; $('#tk-ns',ov).onkeydown = e => { if (e.key==='Enter'){ e.preventDefault(); add(); } };
  const showPh = d => { $('#tk-ph',ov).innerHTML = d ? `<img src="${d}" alt="">` : `${ic('camera')}<span>Add a photo</span>`; };
  if (W.photo) phGet(W.photo).then(d=>d&&showPh(d)).catch(()=>{});
  $('#tk-ph',ov).onclick = async () => { const d=await pickPhoto(); if (d){ W.pdata=d; showPh(d); } };
  const phx=$('#tk-phx',ov); if (phx) phx.onclick = () => { W.photo=''; W.pdata=null; showPh(null); phx.remove(); };
  $('[data-c]',ov).onclick = closeModal;
  if (!isNew) $('[data-del]',ov).onclick = () => { const o=JSON.parse(JSON.stringify(x)); DB.tasks=DB.tasks.filter(y=>y.id!==x.id); if (TM.tid===x.id) TM.tid=''; save(); closeModal(); render(); toast('Deleted', ()=>{ DB.tasks.push(o); save(); render(); }); };
  $('[data-s]',ov).onclick = async () => { const ti=$('#tk-t',ov).value.trim(), e=$('#tk-e',ov).value; if (!ti){ toast('What is the task?'); return; }
    if (e!=='' && !(num(e)>=0 && num(e)<=1440)){ toast('Time: 0 to 1440 minutes'); return; }
    const pend=$('#tk-ns',ov).value.trim(); if (pend) W.steps.push({id:uid(), text:pend, done:false});
    let photo=W.photo; if (W.pdata){ photo=photo||('ph'+uid()); try { await phPut(photo, W.pdata); } catch(err){ toast("Photo couldn't be saved"); photo=W.photo; } }
    if (x.photo && x.photo!==photo) phDel(x.photo).catch(()=>{});
    Object.assign(x,{title:ti, sub:$('#tk-s',ov).value, kind:$('#tk-k',ov).value, due:$('#tk-d',ov).value, pri, est:e===''?'':Math.round(num(e)), steps:W.steps.filter(s=>s.text.trim()), notes:$('#tk-n',ov).value.trim(), photo});
    if (isNew) DB.tasks.push(x); save(); closeModal(); render(); toast(isNew?'Task added':'Saved'); };
  setTimeout(()=>{ if (isNew) $('#tk-t',ov)?.focus(); }, 60);
}
ACT.printTasks = () => { const L=openTasks();
  $('#print').innerHTML = `<h1>Assignments & tasks</h1><p>${fmtLong(todayKey())}</p><table><tr><th>Due</th><th>Task</th><th>Subject</th><th>Type</th><th>Done</th></tr>${L.map(t=>`<tr><td>${t.due?fmtMid(t.due):'—'}</td><td><b>${esc(t.title)}</b>${t.steps.length?`<div class="ps">${t.steps.map(s=>(s.done?'☑ ':'☐ ')+esc(s.text)).join('<br>')}</div>`:''}</td><td>${esc(subName(t.sub))}</td><td>${kindName(t.kind)}</td><td>☐</td></tr>`).join('')}</table>
   <h2>Exams</h2><table><tr><th>Date</th><th>Exam</th><th>Subject</th><th>Days left</th></tr>${upcomingExams().map(e=>`<tr><td>${fmtMid(e.date)}${e.time?' '+hm(e.time):''}</td><td>${esc(e.title)}</td><td>${esc(subName(e.sub))}</td><td>${daysTo(e.date)}</td></tr>`).join('')}</table>`;
  setTimeout(()=>window.print(),50); };
function csvOf(head, rows){ return [head, ...rows].map(r=>r.map(csvCell).join(',')).join('\n'); }
ACT.csvTasks = () => download(`student-planner-tasks-${todayKey()}.csv`, csvOf(['Due','Task','Subject','Type','Priority','Done','Steps done','Steps','Minutes studied','Notes'],
  DB.tasks.slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).map(t=>[t.due, t.title, subName(t.sub), kindName(t.kind), (PRI.find(p=>p[0]===t.pri)||[])[1]||'', t.done?'Yes':'No', t.steps.filter(s=>s.done).length, t.steps.length, Math.round(num(t.studySec)/60), t.notes||''])), 'text/csv');

/* exams */
function vExams(){ const t=todayKey(), U=upcomingExams().filter(e=>!S.tsub||e.sub===S.tsub), P=DB.exams.filter(e=>e.date<t).sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="row" style="margin-top:14px"><button class="btn pri sm" data-act="examNew">${ic('plus')} Add an exam</button></div>
  <div class="tgrid" style="margin-top:12px">${U.map(e=>{ const d=daysTo(e.date), tp=e.topics.length, td=e.topics.filter(x=>x.done).length; return `<div class="card ecard" style="border-top:4px solid ${subColor(e.sub)}">
    <div class="between" style="flex-wrap:nowrap"><div style="min-width:0"><div class="eyebrow">${esc(subName(e.sub))}</div><h3>${esc(e.title)}</h3><p class="tiny faint">${fmtLong(e.date)}${e.time?' · '+hm(e.time):''}${e.room?' · '+esc(e.room):''}</p></div><span class="cdown big" style="--kc:${subColor(e.sub)}"><b>${d}</b><small>${d===0?'today':d===1?'day':'days'}</small></span></div>
    ${tp?`<div class="prog" style="margin-top:10px"><i style="width:${Math.round(td/tp*100)}%"></i></div><p class="tiny faint" style="margin-top:4px">${td}/${tp} topics revised</p><div class="list etopics">${e.topics.map(x=>`<div><input type="checkbox" class="chk" data-act="topicTog" data-arg="${e.id}|${x.id}" ${x.done?'checked':''} aria-label="Revised"><span class="grow small ${x.done?'done-t':''}">${esc(x.text)}</span></div>`).join('')}</div>`:'<p class="small muted" style="margin-top:8px">Add the topics to make a revision plan.</p>'}
    <div class="row" style="margin-top:10px;gap:6px"><button class="btn sm" data-act="examEdit" data-arg="${e.id}">${ic('edit')} Edit</button>${tp&&td<tp&&d>0?`<button class="btn sm pri" data-act="revPlan" data-arg="${e.id}">${ic('calendar')} Revision plan</button>`:''}</div></div>`; }).join('')||'<div class="card empty">No exams coming up.</div>'}</div>
  ${P.length?`<div class="card" style="margin-top:14px"><h3>Past exams</h3><div class="list" style="margin-top:4px">${P.slice(0,12).map(e=>`<div class="clk" data-act="examEdit" data-arg="${e.id}">${sdot(e.sub)}<div class="grow">${esc(e.title)}<div class="tiny faint">${esc(subName(e.sub))} · ${fmtMid(e.date)}</div></div></div>`).join('')}</div></div>`:''}`;
}
ACT.topicTog = arg => { const [eid,tid]=arg.split('|'), e=exam(eid); if(!e) return; const x=e.topics.find(y=>y.id===tid); if(!x) return; x.done=!x.done;
  DB.tasks.filter(t=>t.eid===eid && t.tid===tid).forEach(t=>{ t.done=x.done; t.doneAt=x.done?new Date().toISOString():''; }); save(); render(); };
ACT.examNew = k => examEditor({id:'', sub:S.tsub||(DB.subjects[0]||{}).id||'', title:'', date:k||addDays(todayKey(),14), time:'', room:'', topics:[]});
ACT.examEdit = id => { const e=exam(id); if (e) examEditor(e); };
function examEditor(e){ const isNew=!e.id;
  const ov = modal(isNew?'Add an exam':'Edit exam', `<div class="grid g2 sec"><div><label class="f">Exam *</label><input type="text" id="ex-t" value="${esc(e.title)}" placeholder="Midterm"></div><div><label class="f">Subject</label><select id="ex-s">${subOpts(e.sub)}</select></div></div>
   <div class="grid g3 sec"><div><label class="f">Date</label><input type="date" id="ex-d" value="${e.date}"></div><div><label class="f">Time</label><input type="time" id="ex-h" value="${e.time||''}"></div><div><label class="f">Room</label><input type="text" id="ex-r" value="${esc(e.room||'')}"></div></div>
   <div class="sec"><label class="f">Topics to revise <span class="faint">(one per line)</span></label><textarea id="ex-tp" placeholder="Cell structure\nPhotosynthesis\nEnzymes">${esc(e.topics.map(x=>x.text).join('\n'))}</textarea></div>`,
   `${isNew?'':'<button class="btn danger ghost" data-del style="margin-right:auto">Delete</button>'}<button class="btn" data-c>Cancel</button><button class="btn pri" data-s>Save</button>`);
  $('[data-c]',ov).onclick = closeModal;
  if (!isNew) $('[data-del]',ov).onclick = () => { const o=JSON.parse(JSON.stringify(e)), rt=DB.tasks.filter(t=>t.eid && t.eid===e.id); DB.exams=DB.exams.filter(x=>x.id!==e.id); DB.tasks=DB.tasks.filter(t=>!(t.eid && t.eid===e.id)); save(); closeModal(); render(); toast('Exam deleted', ()=>{ DB.exams.push(o); DB.tasks.push(...rt); save(); render(); }); };
  $('[data-s]',ov).onclick = () => { const ti=$('#ex-t',ov).value.trim(), d=$('#ex-d',ov).value; if (!ti){ toast('Name the exam'); return; } if (!d){ toast('Pick the exam date'); return; }
    const lines=[...new Set($('#ex-tp',ov).value.split('\n').map(s=>s.trim()).filter(Boolean))];
    if (lines.length>60){ toast('Up to 60 topics'); return; }
    const topics=lines.map(txt=>{ const old=e.topics.find(x=>x.text===txt); return old||{id:uid()+Math.random().toString(36).slice(2,5), text:txt, done:false}; });
    Object.assign(e,{title:ti, sub:$('#ex-s',ov).value, date:d, time:$('#ex-h',ov).value, room:$('#ex-r',ov).value.trim(), topics});
    if (!isNew) DB.tasks=DB.tasks.filter(t=>!(t.eid && t.eid===e.id && !t.done && !topics.some(x=>x.id===t.tid)));
    if (isNew){ e.id=uid(); DB.exams.push(e); } save(); closeModal(); render(); toast('Exam saved'); };
}
ACT.revPlan = id => { const e=exam(id); if(!e) return; const p=revisionPlan(e); if (p.err){ toast(p.err); return; }
  const ov = modal('Revision plan', `<p class="muted" style="margin-top:12px">${plural(p.out.length,'topic')} over ${plural(Math.min(p.days, Math.ceil(p.out.length/p.per)),'day')} — about ${p.per} a day, finishing the day before the exam. Each day becomes a revision task on your list.</p>
   <div class="list" style="margin-top:8px">${[...new Set(p.out.map(o=>o.day))].map(d=>`<div><span class="datebox"><b>${pkey(d).getDate()}</b><small>${MON[pkey(d).getMonth()]}</small></span><div class="grow small">${p.out.filter(o=>o.day===d).map(o=>esc(o.topic.text)).join(' · ')}</div></div>`).join('')}</div>`,
   `<button class="btn" data-c>Cancel</button><button class="btn pri" data-s>Add to my tasks</button>`);
  $('[data-c]',ov).onclick = closeModal;
  $('[data-s]',ov).onclick = () => { DB.tasks=DB.tasks.filter(t=>!(t.eid && t.eid===e.id && !t.done)); p.out.forEach(o=>DB.tasks.push(newTask({title:`Revise: ${o.topic.text}`, sub:e.sub, kind:'revision', due:o.day, eid:e.id, tid:o.topic.id, est:30}))); save(); closeModal(); render(); toast(`${plural(p.out.length,'revision task')} added`); };
};

/* ---------- grades, GPA & attendance ---------- */
function vGrades(){
  if (S.gsid && sub(S.gsid) && S.gseg==='grades') return `<button class="link back" data-act="gBack">${ic('left')} All subjects</button>` + vSubDetail(sub(S.gsid));
  return `<div class="between"><h1>Grades</h1>${seg('gseg',[['grades','Grades & GPA'],['att','Attendance']],S.gseg)}</div>` + (S.gseg==='att' ? vAtt() : vGpa());
}
ACT.gBack = () => { S.gsid=null; render(); };
function vGpa(){ const tg=termGpa(), cg=cumGpa(), A=DB.subjects.map(s=>subAvg(s.id)).filter(x=>x!=null), avgAll=A.length?A.reduce((s,x)=>s+x,0)/A.length:null, school=DB.settings.level==='school';
  return `<div class="grid g4" style="margin-top:14px"><div class="tile"><div class="l">${school?'GPA':'Term GPA'}</div><div class="v">${fmtGpa(tg.gpa)}</div><div class="s">${tg.credits?`${r1(tg.credits).replace(/\.0$/,'')} ${school?'weight':'credits'}`:'add grades'}</div></div>
   <div class="tile"><div class="l">Overall GPA</div><div class="v">${fmtGpa(cg)}</div><div class="s">${DB.settings.prevGpa!==''&&num(DB.settings.prevCred)>0?'incl. past terms':'set past GPA in Settings'}</div></div>
   <div class="tile"><div class="l">Average</div><div class="v">${fmtPct(avgAll)}</div><div class="s">${avgAll==null?'':letter(avgAll)}</div></div><div class="tile"><div class="l">Grades</div><div class="v">${DB.grades.length}</div></div></div>
  <div class="row" style="margin-top:14px"><button class="btn pri sm" data-act="gradeNew">${ic('plus')} Add a grade</button><button class="btn sm" data-act="csvGrades">${ic('down')} CSV</button><button class="btn sm" data-act="printGrades">${ic('print')} Print</button></div>
  <div class="card" style="margin-top:12px"><div class="list">${DB.subjects.map(s=>{ const a=subAvg(s.id), g=gradeOf(a); return `<div class="clk" data-act="subOpen" data-arg="${s.id}">${sdot(s.id)}<div class="grow"><b style="font-weight:500">${esc(s.name)}</b><div class="tiny faint">${plural(gradesFor(s.id).length,'grade')}${num(s.credits)?` · ${plural(num(s.credits),school?'weight':'credit')}`:''}${Object.keys(s.weights||{}).length?' · weighted':''}</div><div class="prog" style="margin-top:6px"><i style="width:${Math.min(100,a||0)}%;background:${s.color}"></i></div></div><div class="gbadge"><b>${a==null?'—':g[1]}</b><span>${fmtPct(a)}</span></div></div>`; }).join('')||'<p class="empty">Add subjects in Schedule › Subjects first.</p>'}</div></div>
  <div class="note" style="margin-top:12px">GPA = (grade points × credits) ÷ total credits. Scale: ${({us:'US 4.0 with + and −',af:'Simple A–F (4,3,2,1,0)',pk:'University 4.0 (85% = A)'})[DB.settings.scale]||''} — change it in More › Settings.</div>`;
}
function vSubDetail(s){ const a=subAvg(s.id), G=gradesFor(s.id), W=s.weights||{}, cats=[...new Set([...Object.keys(W), ...G.map(g=>g.cat)])], at=attStats(s.id);
  return `<div class="between" style="margin-top:4px"><div><div class="eyebrow">${[s.code,s.teacher].filter(Boolean).map(esc).join(' · ')||'Subject'}</div><h1 style="color:${s.color}">${esc(s.name)}</h1></div><div class="gbadge lg"><b>${a==null?'—':letter(a)}</b><span>${fmtPct(a)}</span></div></div>
  <div class="cols" style="margin-top:14px"><div class="stack">
   <div class="card"><div class="between"><h3>Grades</h3><button class="btn pri sm" data-act="gradeNew" data-arg="${s.id}">${ic('plus')} Add</button></div>
    <div class="tblw" style="margin-top:8px"><table class="tbl"><tr><th>Item</th><th>Type</th><th class="num-r">Score</th><th class="num-r">%</th></tr>${G.map(g=>`<tr class="clk" data-act="gradeEdit" data-arg="${g.id}"><td>${esc(g.title)}<div class="tiny faint">${g.date?fmtShort(g.date):''}</div></td><td class="small">${esc(g.cat)}</td><td class="num-r">${r1(+g.score).replace(/\.0$/,'')}/${r1(num(g.max)).replace(/\.0$/,'')}</td><td class="num-r">${fmtPct(gPct(g))}</td></tr>`).join('')||'<tr><td colspan="4" class="muted small">No grades yet.</td></tr>'}</table></div></div>
   ${cats.length?`<div class="card"><h3>By type</h3>${cats.map(c=>{ const v=catAvg(s.id,c); return `<div class="bar-row"><span>${esc(c)}${num(W[c])?` <span class="faint">${W[c]}%</span>`:''}</span><div class="bar-bg"><div class="bar-fg" style="width:${Math.min(100,v||0)}%;background:${s.color}"></div></div><span>${fmtPct(v)}</span></div>`; }).join('')}<p class="tiny faint" style="margin-top:6px">${Object.keys(W).length?'Weighted: types without marks yet are left out until you have marks.':'No weights set — average = total points ÷ total possible.'} <button class="link tiny" data-act="subEdit" data-arg="${s.id}">Edit weights</button></p></div>`:''}
  </div><div class="stack">
   <div class="card"><h3>What do I need on the final?</h3><p class="small muted">Your average now is <b>${fmtPct(a)}</b>.</p>
    <div class="grid g2" style="margin-top:10px"><div><label class="f">Grade I want (%)</label><input type="number" id="fn-t" min="0" max="100" value="${S.fnT??90}"></div><div><label class="f">Final is worth (%)</label><input type="number" id="fn-w" min="1" max="100" value="${S.fnW??30}"></div></div>
    <div class="verdict" id="fn-out" style="margin-top:12px">${finalBox(a)}</div></div>
   <div class="card"><h3>Attendance</h3>${attBlock(s.id, at)}</div>
   <div class="card"><h3>Open tasks</h3><div class="list" style="margin-top:4px">${openTasks().filter(t=>t.sub===s.id).slice(0,5).map(t=>taskRow(t)).join('')||'<p class="small muted" style="padding:6px 0">Nothing open.</p>'}</div></div>
  </div></div>`;
}
function finalBox(a){ const t=num(S.fnT??90), w=num(S.fnW??30), n=finalNeeded(a,t,w);
  if (n==null) return '<div class="small">Add a grade first, and a final weight from 1 to 100%.</div>';
  const cls = n<=0?'buy':n<=100?'think':'pass';
  return `<div class="${cls} vbox"><div class="vn">${n<=0?'0%':fmtPct(n)}</div><div class="small">${n<=0?`You already have ${fmtPct(t)} locked in — even 0% on the final keeps it.`:n<=100?`Score at least ${fmtPct(n)} on the final to finish with ${fmtPct(t)}.`:`You'd need ${fmtPct(n)} — over 100%. Try a lower target.`}</div></div>`; }
function attBlock(sid, at){ const min=num(DB.settings.minAtt);
  if (!at.n) return `<p class="small muted" style="margin-top:6px">No attendance marked yet. Tap P / L / A next to today's classes.</p>`;
  return `<div class="row" style="margin-top:8px;flex-wrap:nowrap"><div class="attbig ${at.pct<min?'neg':'pos'}">${Math.round(at.pct)}%</div><div class="grow small">${at.p} present · ${at.l} late · ${at.a} absent${at.e?` · ${at.e} excused`:''}<div class="tiny ${at.need?'neg':'faint'}" style="margin-top:3px">${at.need?`Below ${min}% — attend the next ${plural(at.need,'class','classes')} in a row to get back.`:`You can miss ${plural(at.canMiss,'more class','more classes')} and stay at ${min}%.`}</div></div></div>`; }
function vAtt(){ const k=S.attD||todayKey(), L=subsOn(k).length?subsOn(k):[];
  return `<div class="card" style="margin-top:14px"><div class="between"><h3>Mark attendance</h3><input type="date" id="at-d" value="${k}" style="width:auto"></div>
   <div class="list" style="margin-top:6px">${(L.length?L.map(sub):DB.subjects).map(s=>{ const v=attGet(k,s.id); return `<div>${sdot(s.id)}<div class="grow">${esc(s.name)}</div><div class="att">${ATT.map(([a,l])=>`<button class="${v===a?'on '+a:''}" data-act="attTap" data-arg="${k}|${s.id}|${a}" title="${l}" aria-label="${l}">${a}</button>`).join('')}</div></div>`; }).join('')||'<p class="small muted">Add subjects first.</p>'}</div>
   <p class="tiny faint" style="margin-top:6px">${L.length?`Showing the subjects on your timetable for ${fmtMid(k)}.`:'No classes on your timetable that day — showing all subjects.'} P present · L late (counts as present) · A absent · E excused (left out).</p></div>
  <div class="tgrid" style="margin-top:12px">${DB.subjects.map(s=>`<div class="card" style="border-top:4px solid ${s.color}"><h3>${esc(s.name)}</h3>${attBlock(s.id, attStats(s.id))}</div>`).join('')}</div>

  $('#gr-v',ov).oninput=pv; $('#gr-m',ov).oninput=pv; pv();
  $('[data-c]',ov).onclick = closeModal;
  if (!isNew) $('[data-del]',ov).onclick = () => { const o={...g}; DB.grades=DB.grades.filter(x=>x.id!==g.id); save(); closeModal(); render(); toast('Grade deleted', ()=>{ DB.grades.push(o); save(); render(); }); };
  $('[data-s]',ov).onclick = () => { const t=$('#gr-t',ov).value.trim(), v=$('#gr-v',ov).value, m=$('#gr-m',ov).value;
    if (!t){ toast('Name it, e.g. “Quiz 2”'); return; } if (!(num(m)>0)){ toast('“Out of” must be more than 0'); return; }

ACT.dayTog = d => { const s=DB.settings, n=+d; s.days = s.days.includes(n) ? s.days.filter(x=>x!==n) : [...s.days, n]; if(!s.days.length){ s.days=[n]; toast('Keep at least one school day'); } save(); render(); };
const hasData = () => DB.subjects.length || DB.tasks.length || DB.grades.length;
ACT.demo = () => { const run = () => { const s=DB.settings; DB=blank(); DB.settings=Object.assign(s,{days:[1,2,3,4,5]}); makeDemo(); DB.settings.demo=true; S.gsid=null; TM.sid=''; TM.tid=''; save(); go('today'); toast('Sample data loaded'); }; if (hasData()) confirmBox('Sample data replaces your current entries. Export a backup first if you want to keep them.', run, 'Load sample'); else run(); };
ACT.wipe = () => confirmBox('This permanently removes every subject, class, task, exam, grade and attendance mark stored in this browser. Export a backup first if you want to keep anything.', ()=>{ const s=DB.settings; DB=blank(); DB.settings=Object.assign(s,{demo:false, prevGpa:'', prevCred:''}); S.gsid=null; TM.sid=''; TM.tid=''; save(); go('today'); toast('All data cleared'); }, 'Clear everything');

/* page bindings */
bindPage = () => {
  const qt=$('#qtask'); if (qt) qt.onkeydown = e => { if (e.key==='Enter') ACT.taskQuick(); };
  const im=$('#imp'); if (im) im.onchange = () => im.files[0] && importFile(im.files[0]);
  const ad=$('#at-d'); if (ad) ad.onchange = () => { if (ad.value){ S.attD=ad.value; render(); } };
  const ss=$('#st-s'); if (ss) ss.onchange = () => { if (TM.run) tmCredit(); TM.sid=ss.value; if (TM.tid && (task(TM.tid)||{}).sub!==TM.sid) TM.tid=''; render(); };
  const stt=$('#st-t'); if (stt) stt.onchange = () => { if (TM.run) tmCredit(); TM.tid=stt.value; const x=task(TM.tid); if (x && x.sub) TM.sid=x.sub; render(); };
  const fin = () => { const t=$('#fn-t'), w=$('#fn-w'); if (!t) return; S.fnT=t.value===''?0:num(t.value); S.fnW=num(w.value); $('#fn-out').innerHTML=finalBox(subAvg(S.gsid)); };
  ['#fn-t','#fn-w'].forEach(id=>{ const e=$(id); if (e) e.oninput=fin; });
  const chg = (id, f) => { const e=$(id); if (e) e.onchange = () => { if (f(e.type==='checkbox'?e.checked:e.value.trim())===false){ render(); return; } save(); toast('Saved'); }; };
  chg('#set-name', v=>{ DB.settings.name=v; }); chg('#set-school', v=>{ DB.settings.school=v; });
  chg('#set-att', v=>{ const n=Math.round(num(v)); if (n<1||n>99){ toast('Use 1 to 99%'); return false; } DB.settings.minAtt=n; });
  chg('#set-pg', v=>{ if (v!=='' && !(num(v)>=0 && num(v)<=4.0)){ toast('GPA: 0 to 4.0'); return false; } DB.settings.prevGpa=v===''?'':num(v); render(); });
  chg('#set-pc', v=>{ if (v!=='' && !(num(v)>=0 && num(v)<=400)){ toast('Credits: 0 to 400'); return false; } DB.settings.prevCred=v===''?'':num(v); });
  chg('#set-fo', v=>{ const n=Math.round(num(v)); if(n<1||n>180){ toast('Use 1 to 180 minutes'); return false; } DB.settings.focus=n; if(!TM.run && TM.mode==='focus'){ TM.total=TM.left=n*60; } });
  chg('#set-br', v=>{ const n=Math.round(num(v)); if(n<1||n>60){ toast('Use 1 to 60 minutes'); return false; } DB.settings.brk=n; });
  chg('#set-snd', v=>{ DB.settings.sound=v; });
};

/* ---------- sample data ---------- */
function makeDemo(){
  let seed=5; const rnd=()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };
  const t=todayKey(), col=DB.settings.level!=='school'; DB.settings.name=DB.settings.name||'Maya'; DB.settings.school=DB.settings.school||(col?'Riverside College':'Lincoln High School');
  const SUBS = col ? [['Biology','BIO 101','Dr. Patel','Sci 204',4,{Exam:40,Test:30,Lab:20,Homework:10}],['Calculus I','MATH 151','Prof. Kim','Hall B',4,{Exam:50,Quiz:20,Homework:30}],['English Composition','ENG 102','Ms. Rivera','Arts 12',3,{}],['World History','HIS 110','Dr. Okafor','Room 9',3,{Exam:50,Project:30,Participation:20}],['Chemistry Lab','CHEM 105','Dr. Lee','Lab 3',1,{}],['Psychology','PSY 100','Prof. Adams','Hall A',3,{}]]
    : [['Biology','','Mr. Patel','Room 14',1,{Test:50,Homework:20,Lab:30}],['Algebra II','','Ms. Kim','Room 21',1,{Test:60,Quiz:20,Homework:20}],['English','','Ms. Rivera','Room 5',1,{}],['US History','','Mr. Okafor','Room 9',1,{}],['Chemistry','','Mrs. Lee','Lab 2',1,{}],['Spanish','','Sra. Lopez','Room 3',1,{}]];
  const ids = SUBS.map(([name,code,teacher,room,credits,weights],i)=>{ const s={id:'s'+i+uid(), name, code, teacher, room, credits, color:SUB_COLORS[i], weights}; DB.subjects.push(s); return s.id; });
  const [bio,math,eng,his,chem,psy] = ids;
  const SL = col ? [[1,bio,'09:00','10:15','Lecture'],[1,math,'10:30','11:45','Lecture'],[1,psy,'13:00','14:15','Lecture'],[2,eng,'09:30','10:45','Seminar'],[2,his,'11:00','12:15','Lecture'],[2,chem,'14:00','16:00','Lab'],[3,bio,'09:00','10:15','Lecture'],[3,math,'10:30','11:45','Lecture'],[3,psy,'13:00','14:15','Lecture'],[4,eng,'09:30','10:45','Seminar'],[4,his,'11:00','12:15','Lecture'],[4,math,'14:00','14:50','Tutorial'],[5,bio,'10:00','11:50','Lab'],[5,psy,'13:00','13:50','Tutorial']]
    : [1,2,3,4,5].flatMap(d=>[[d,bio,'08:00','08:50','Class'],[d,math,'09:00','09:50','Class'],[d,eng,'10:00','10:50','Class'],[d,his,'11:00','11:50','Class'],[d,d%2?chem:psy,'12:40','13:30',d%2?'Lab':'Class']]);
  SL.forEach(([day,s,a,b,kind],i)=>DB.slots.push({id:'c'+i+uid(), sub:s, day, start:a, end:b, room:sub(s).room, kind}));
  /* grades */
  const G = (s,title,cat,score,max,off) => DB.grades.push({id:uid()+DB.grades.length, sub:s, title, cat, score, max, date:addDays(t,off)});
  G(bio,'Quiz: cells','Test',17,20,-30); G(bio,'Lab 1: microscopes','Lab',46,50,-24); G(bio,'Homework set 1','Homework',9,10,-20); G(bio,'Midterm exam','Exam',81,100,-9); G(bio,'Lab 2: enzymes','Lab',44,50,-5);
  G(math,'Quiz 1','Quiz',8,10,-28); G(math,'Problem set 1','Homework',18,20,-21); G(math,'Quiz 2','Quiz',7,10,-14); G(math,'Midterm exam','Exam',74,100,-8); G(math,'Problem set 2','Homework',19,20,-6);
  G(eng,'Essay 1','Project',88,100,-25); G(eng,'Reading response','Homework',9,10,-12); G(eng,'Essay 2 draft','Project',91,100,-4);
  G(his,'Map quiz','Exam',42,50,-26); G(his,'Source analysis','Project',27,30,-15); G(his,'Seminar participation','Participation',18,20,-3);
  G(chem,'Lab report 1','Lab',27,30,-20); G(chem,'Lab report 2','Lab',25,30,-6);
  G(psy,'Quiz 1','Quiz',16,20,-22); G(psy,'Reflection paper','Project',45,50,-10); G(psy,'Quiz 2','Quiz',18,20,-2);
  /* attendance for the last 4 weeks */
  for (let i=1;i<=28;i++){ const k=addDays(t,-i); subsOn(k).forEach(s=>{ const r=rnd(); attSet(k,s, s===math&&r<.18?'A':r<.05?'A':r<.1?'L':r<.12?'E':'P'); }); }
  /* tasks */
  const T = (title,s,kind,d,pri,steps=[],extra={}) => { const x=newTask({title, sub:s, kind, due:d===''?'':addDays(t,d), pri, steps:steps.map((a,i)=>({id:'st'+i+uid(), text:a, done:false})), ...extra}); DB.tasks.push(x); return x; };
  T('Lab report: enzyme activity',bio,'assignment',1,'high',['Write the method','Make the graph','Discussion','Proofread'],{est:120});
  T('Problem set 3',math,'homework',2,'med',[],{est:60});
  T('Essay 3: argument outline',eng,'assignment',4,'med',['Pick a topic','Find 3 sources','Outline'],{est:90});
  T('Read chapter 7',psy,'reading',3,'low',[],{est:40});
  T('Research project: Silk Road',his,'project',12,'high',['Choose a focus question','Collect 5 sources','Draft','Slides','Practise the talk'],{est:300});
  T('Quiz corrections',math,'homework',-1,'med');
  T('Email Dr. Lee about lab safety form',chem,'other','', 'low');
  T('Buy a scientific calculator','', 'other','', 'low');
  const dn = (x,d) => { x.done=true; x.doneAt=new Date(pkey(addDays(t,d)).getTime()+15*36e5).toISOString(); x.steps.forEach(s=>s.done=true); };
  [['Problem set 2',math,'homework',-6,-7],['Essay 2 draft',eng,'assignment',-4,-4],['Lab 2 write-up',bio,'assignment',-5,-6],['Read chapter 6',psy,'reading',-3,-3],['Source analysis',his,'assignment',-2,-1]].forEach(([ti,s,k,d,dd])=>dn(T(ti,s,k,d,'med'),dd));
  const lr=DB.tasks[0]; lr.steps[0].done=true; lr.steps[1].done=true; lr.studySec=50*60;
  /* exams */
  const E = (s,title,d,time,topics,doneN) => { const e={id:'e'+uid()+DB.exams.length, sub:s, title, date:addDays(t,d), time, room:sub(s).room, topics:topics.map((x,i)=>({id:'tp'+i+uid(), text:x, done:i<doneN}))}; DB.exams.push(e); return e; };
  E(math,'Calculus quiz 3',5,'10:30',['Limits','Derivative rules','Chain rule','Implicit differentiation'],2);
  E(bio,'Unit 3 test',9,'09:00',['Cell respiration','Photosynthesis','Enzymes','DNA structure','Mitosis','Meiosis'],1);
  E(his,'Final exam',24,'13:00',['Ancient empires','Trade routes','Religions','Renaissance','Exploration'],0);
  /* study time: last 14 days */
  for (let i=0;i<=13;i++){ const k=addDays(t,-i); DB.study[k]={}; [bio,math,eng,his,psy].forEach(s=>{ if (rnd()<.45) DB.study[k][s]=Math.round((15+rnd()*50))*60; }); DB.days[k]={sessions:Math.round(studyDay(k)/1500)}; }
  DB.study[t]={[bio]:50*60, [math]:25*60}; DB.days[t]={sessions:3};
  DB.habits.forEach((h,hi)=>{ for (let i=1;i<=14;i++){ const k=addDays(t,-i); if (hDue(h,k) && rnd()<[.8,.6,.7][hi%3]) hToggle(k,h.id); } }); hToggle(t,'h-read');
  if (col){ DB.settings.prevGpa=3.42; DB.settings.prevCred=30; }
}

/* ---------- welcome ---------- */
function welcome(){ let lvl=DB.settings.level;
  const ov = modal('Welcome <span style="color:var(--accent)">✦</span>', `<p class="muted" style="margin-top:12px">Your classes, assignments, exams and grades in one calm place — on your phone and computer, even offline.</p>
    <div class="grid g2 sec"><div><label class="f">Your name <span class="faint">(optional)</span></label><input type="text" id="w-name" placeholder="Maya" value="${esc(DB.settings.name)}"></div><div><label class="f">School / college <span class="faint">(optional)</span></label><input type="text" id="w-school" value="${esc(DB.settings.school)}"></div></div>
    <div class="sec"><label class="f">I'm in</label><div class="seg full" id="w-l">${[['school','High school'],['college','College / uni']].map(([k,l])=>`<button class="${lvl===k?'on':''}" data-l="${k}">${l}</button>`).join('')}</div></div>
    <div class="private small" style="margin-top:16px">${ic('lock')} No login and no cloud — your grades stay on this device.</div>`,
    `<button class="btn" data-demo>${ic('sparkle')} Explore with sample data</button><button class="btn pri" data-start>Start planning</button>`, {sticky:true});
  $('.x', ov).style.display='none';
  $$('#w-l button',ov).forEach(b=>b.onclick=()=>{ lvl=b.dataset.l; $$('#w-l button',ov).forEach(x=>x.classList.toggle('on',x===b)); });
  const done = demo => { DB.settings.name=$('#w-name',ov).value.trim(); DB.settings.school=$('#w-school',ov).value.trim(); DB.settings.level=lvl; if (lvl==='school') DB.settings.scale='af'; DB.settings.setup=true; if (demo){ makeDemo(); DB.settings.demo=true; } save(); closeModal(); render(); toast(demo?'Sample term loaded — clear it any time in Settings':'Start by adding your subjects'); };
  $('[data-start]',ov).onclick = () => done(false); $('[data-demo]',ov).onclick = () => done(true);
}

/* ---------- init ---------- */
load();
$('#logo').innerHTML = LOGO;
render();
if (!DB.settings.setup) welcome();
window.addEventListener('afterprint', ()=>{ $('#print').innerHTML=''; });
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden && !$('#ov')) render(); });
let rzT, lastW = innerWidth; window.addEventListener('resize', ()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ if ((innerWidth<760)!==(lastW<760) && !$('#ov')) render(); lastW=innerWidth; },200); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/localhost|127\.0\.0\.1/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
